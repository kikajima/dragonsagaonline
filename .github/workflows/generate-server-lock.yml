name: Generate server lockfile

on:
  push:
    branches:
      - authoritative-world-hardening
    paths:
      - server/package.json
      - .github/workflows/generate-server-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: authoritative-world-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
        continue-on-error: true
      - name: Generate lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- server/package-lock.json && git ls-files --error-unmatch server/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git commit -m "Add reproducible server dependency lock"
          git push origin HEAD:authoritative-world-hardening
