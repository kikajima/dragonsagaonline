name: Cloudflare compatibility

on:
  push:
    branches:
      - cloudflare-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install existing dependencies
        run: bun install --frozen-lockfile

      - name: Check vinext compatibility
        run: bunx vinext check

      - name: Verify current Next.js build
        run: bun run build
